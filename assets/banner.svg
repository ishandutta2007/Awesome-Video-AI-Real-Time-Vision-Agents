<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <!-- Glow & Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Animated pulses and subtle flows in background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.45; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes radarWave {
      0% { r: 5; opacity: 0.9; }
      100% { r: 45; opacity: 0; }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .bg-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .bg-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 240px;
    }
    .scan-beam {
      animation: scanLine 3.5s linear infinite;
    }
    .radar-circle-1 {
      animation: radarWave 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .radar-circle-2 {
      animation: radarWave 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.4s;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowDash 2.5s linear infinite;
    }
    .pill-motion-1 {
      animation: floatPill 4s ease-in-out infinite;
    }
    .pill-motion-2 {
      animation: floatPill 4.5s ease-in-out infinite 0.7s;
    }
    .pill-motion-3 {
      animation: floatPill 5s ease-in-out infinite 1.4s;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Background Decorative Glowing Orbs (Deep in background) -->
  <circle class="bg-orb-1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle class="bg-orb-2" cx="1020" cy="230" r="160" fill="#818cf8" filter="url(#cyanGlow)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Ambient Flowing Pipeline Lines (Dynamic Aspect behind text) -->
  <path d="M 50,180 Q 300,230 600,170 T 1150,190" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.35" class="flow-line" />
  <path d="M 80,140 Q 350,70 650,140 T 1120,110" fill="none" stroke="url(#neonPurple)" stroke-width="1.8" opacity="0.3" class="flow-line" />

  <!-- Vision HUD Graphic Elements on Right Wing (Background/Flanked) -->
  <g transform="translate(980, 70)" opacity="0.85">
    <!-- Camera Target Reticle -->
    <circle cx="90" cy="90" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 8" />
    <circle class="radar-circle-1" cx="90" cy="90" r="10" fill="none" stroke="#00f2fe" stroke-width="2" />
    <circle class="radar-circle-2" cx="90" cy="90" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="90" cy="90" r="4" fill="#38bdf8" />

    <!-- Corner Brackets (Bounding Box) -->
    <path d="M 40,55 L 40,40 L 55,40" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 140,55 L 140,40 L 125,40" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 40,125 L 40,140 L 55,140" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 140,125 L 140,140 L 125,140" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Dynamic Scanning Laser Beam -->
    <line class="scan-beam" x1="42" y1="40" x2="138" y2="40" stroke="#00f2fe" stroke-width="2" filter="url(#subtleGlow)" />

    <!-- Live Telemetry Tag -->
    <rect x="42" y="24" width="70" height="15" rx="3" fill="rgba(14, 165, 233, 0.3)" />
    <text x="77" y="34" fill="#38bdf8" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle">LIVE • 60 FPS</text>
  </g>

  <!-- Left Flank Reticle (Subtle) -->
  <g transform="translate(60, 60)" opacity="0.6">
    <circle cx="40" cy="40" r="30" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3 5" />
    <path d="M 25,40 L 55,40 M 40,25 L 40,55" stroke="#a855f7" stroke-width="1.2" />
    <text x="40" y="85" fill="#c084fc" font-size="8" font-family="monospace" text-anchor="middle">RTSP/WebRTC</text>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Category Chip / Pill -->
  <g transform="translate(140, 48)">
    <rect width="270" height="30" rx="15" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <text x="145" y="20" fill="#e2e8f0" font-size="12" class="sub-text" font-weight="600" text-anchor="middle">
      ⚡ REAL-TIME MULTIMODAL AI AGENTS
    </text>
  </g>

  <!-- Main Headline Title (Crisp, High Contrast, Foreground) -->
  <g transform="translate(140, 125)">
    <text class="title-text" font-size="40" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#neonCyan)">Video AI</tspan> &amp; Real-Time
    </text>
    <text y="50" class="title-text" font-size="40" fill="#f8fafc" letter-spacing="-0.5">
      Vision Agents <tspan fill="url(#neonPurple)">Ecosystem</tspan> 🤖🎥
    </text>
  </g>

  <!-- Subtitle (Clear Foreground) -->
  <text x="140" y="215" fill="#94a3b8" font-size="15" class="sub-text">
    Curated Hub for Low-Latency WebRTC Vision Streams, VLMs, Live Detectors &amp; Edge Analytics
  </text>

  <!-- Dynamic Capability Floating Badges / Tags (Positioned cleanly at bottom) -->
  <g transform="translate(140, 248)">
    <!-- Tag 1 -->
    <g class="pill-motion-1">
      <rect width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="90" y="21" fill="#38bdf8" font-size="12" class="sub-text" font-weight="600" text-anchor="middle">
        👁️ Multimodal VLMs
      </text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(195, 0)" class="pill-motion-2">
      <rect width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
      <text x="92" y="21" fill="#c084fc" font-size="12" class="sub-text" font-weight="600" text-anchor="middle">
        🌐 WebRTC Live Agents
      </text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(395, 0)" class="pill-motion-3">
      <rect width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="92" y="21" fill="#34d399" font-size="12" class="sub-text" font-weight="600" text-anchor="middle">
        ⚡ Edge YOLO / SAM 2
      </text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(595, 0)" class="pill-motion-1">
      <rect width="195" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
      <text x="97" y="21" fill="#fb7185" font-size="12" class="sub-text" font-weight="600" text-anchor="middle">
        🔍 Semantic Video Search
      </text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(805, 0)" class="pill-motion-2">
      <rect width="160" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1" />
      <text x="80" y="21" fill="#fbbf24" font-size="12" class="sub-text" font-weight="600" text-anchor="middle">
        🛡️ Frigate &amp; Scrypted
      </text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#neonCyan)" />
</svg>
